<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KATS!</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <!-- Handwriting font -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #f67738;
            color: #fdfdfe;
            font-family: 'Caveat', cursive, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 1.5rem;
        }
        .logo {
            width: 90vw;
            max-width: 720px;
            aspect-ratio: 3 / 1;
            background-image: url('banner.webp');
            background-position: center;
            background-size: contain;
            background-repeat: no-repeat;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 4.5rem;
            font-weight: 700;
            color: #fdfdfe;
            line-height: 1;
            margin-bottom: 1.75rem;
        }
        a {
            display: inline-block;
            background-color: #fdfdfe;
            color: #f67738;
            text-decoration: none;
            font-size: 2rem;
            font-weight: 700;
            padding: 0.7rem 2.6rem;
            border-radius: 9999px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        a:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18);
        }
    </style>
</head>
<body>
    <div class="logo" role="img" aria-label="/kats logo"></div>
    <h1>KATS!</h1>
    <a href="https://yapin.gg/invite/KATS" target="_blank" rel="noopener noreferrer">Join /kats</a>
</body>
</html>
